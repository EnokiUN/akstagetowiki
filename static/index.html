<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Arknights Stage To Wiki</title>
    <link rel="icon" href="./icon.png">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <fieldset id="input">
      <legend>Input</legend>
      <form id="input-form">
        <input id="stage-input" placeholder="Stage Code (example: SS-EX-8)" />

        <button id="convert">Convert</button>
      </form>
    </fieldset>
    <textarea name="output" id="output" spellcheck=false></textarea>
    <script src="./index.js"></script>
  </body>
</html>
